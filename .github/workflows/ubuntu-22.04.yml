name: Ubuntu 22.04 compatibility

on:
  push:
  pull_request:

jobs:
  jammy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and existing Python tests
        run: |
          bash -n setup.sh install.sh xui-install.sh rollback.sh egress.sh
          python3 -m unittest discover -s tests -v
          grep -Fq 'OCSERV_PORT=110' install.sh
          grep -Fq 'tcp-port = $OCSERV_PORT' install.sh
          grep -Fq 'udp-port = $OCSERV_PORT' install.sh
      - name: Check Ubuntu packages and VPN tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openvpn ocserv nftables iproute2 iptables certbot
          test -f /lib/systemd/system/openvpn-server@.service || test -f /usr/lib/systemd/system/openvpn-server@.service
          command -v ocpasswd
          openvpn --version > "$RUNNER_TEMP/openvpn-version.txt"
          sed -n '1p' "$RUNNER_TEMP/openvpn-version.txt"
          ocserv --version
          if ! getent group ocserv > /dev/null; then sudo groupadd --system ocserv; fi
          if ! getent passwd ocserv > /dev/null; then
            sudo useradd --system --gid ocserv --home-dir /nonexistent --shell /usr/sbin/nologin ocserv
          fi
          openvpn --genkey tls-crypt "$RUNNER_TEMP/tls-crypt.key"
          test -s "$RUNNER_TEMP/tls-crypt.key"
          ocserv --help > "$RUNNER_TEMP/ocserv-help.txt" 2>&1
          grep -q -- '--test-config' "$RUNNER_TEMP/ocserv-help.txt"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.crt" \
            -subj '/CN=vpn.example.com' > /dev/null 2>&1
          touch "$RUNNER_TEMP/ocpasswd"
          cat > "$RUNNER_TEMP/ocserv.conf" <<EOF
          auth = "plain[passwd=$RUNNER_TEMP/ocpasswd]"
          tcp-port = 110
          udp-port = 110
          server-cert = $RUNNER_TEMP/server.crt
          server-key = $RUNNER_TEMP/server.key
          socket-file = /run/ocserv-socket
          run-as-user = ocserv
          run-as-group = ocserv
          device = vpns
          ipv4-network = 10.79.0.0
          ipv4-netmask = 255.255.255.0
          dns = 1.1.1.1
          dns = 9.9.9.9
          route = default
          max-clients = 128
          max-same-clients = 2
          EOF
          sudo ocserv --test-config -c "$RUNNER_TEMP/ocserv.conf"
      - name: Check VPN-only setup beside an existing 3x-ui
        run: |
          sudo mkdir -p /dev/net /etc/x-ui
          if [ ! -c /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; fi
          sudo touch /etc/x-ui/x-ui.db
          echo '127.0.0.1 vpn.example.com' | sudo tee -a /etc/hosts > /dev/null
          output=$(printf 'vpn.example.com\n' | sudo script -e -q -c 'bash ./setup.sh --check --vpn-only' /dev/null)
          grep -Fq 'direct TCP: vpn-only' <<< "$output"
